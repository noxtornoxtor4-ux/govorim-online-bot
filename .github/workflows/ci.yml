name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: Линтер и форматирование
        run: bun run lint

      - name: Проверка типов
        env:
          # Конфиг требует токен уже при загрузке модуля.
          BOT_TOKEN: test-token
        run: bun run typecheck

      - name: Тесты
        # Значения берутся из .env.test — тесты не касаются настоящих сервисов.
        run: bun run test
