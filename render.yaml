services:
  - type: web
    name: govorim-online-bot
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /
    envVars:
      # На бесплатном тарифе Render нет постоянного диска: состояние живёт
      # во временной папке, а переживает перезапуск копия в Google Таблице.
      - key: DATA_DIR
        value: /tmp/data
      - key: TIMEZONE
        value: Asia/Bishkek
      - key: LESSON_TIME
        value: "20:00"
      # Задаются вручную в панели Render, в репозиторий не попадают
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_CODE
        sync: false
      - key: COURSE_START
        sync: false
      - key: SHEETS_WEBAPP_URL
        sync: false
      - key: SHEETS_WEBAPP_TOKEN
        sync: false
